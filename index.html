<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Imagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1000px;
        }

        .card-foto {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 280px;
            text-align: center;
            padding: 10px;
        }

        .card-foto img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
        }

        .card-foto p {
            margin-top: 10px;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Galeria de Fotos</h1>

    <div class="galeria">
        <div class="card-foto">
            <img src="./foto2.jpg" alt="Foto 2">
            <p>Foto 2</p>
        </div>

        <div class="card-foto">
            <img src="./foto3.jpg" alt="Foto 3">
            <p>Foto 3</p>
        </div>

        <div class="card-foto">
            <img src="./foto4.jpg" alt="Foto 4">
            <p>Foto 4</p>
        </div>

        <div class="card-foto">
            <img src="./foto5.jpg" alt="Foto 5">
            <p>Foto 5</p>
        </div>

        <div class="card-foto">
            <img src="./foto6.jpg" alt="Foto 6">
            <p>Foto 6</p>
        </div>

        <div class="card-foto">
            <img src="./ventilador.jpg" alt="Ventilador">
            <p>Ventilador</p>
        </div>
    </div>

</body>
</html>
